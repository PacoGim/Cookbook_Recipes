name: Recipes CI

on:
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "scripts/**"
      - ".github/workflows/recipes.yml"

  pull_request:
    branches:
      - main
    paths:
      - "recipes/**"
      - "scripts/**"
      - ".github/workflows/recipes.yml"

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Validate Script
        run: node scripts/validate.mjs
  
  build_index:
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Run Build Index Script
      run: node scripts/build_index.mjs
    
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./dist
    
  deploy:
    name: Deploy database
    needs: build_index
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

concurrency:
  group: cookbook-pages
  cancel-in-progress: true