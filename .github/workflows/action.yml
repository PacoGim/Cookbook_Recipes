name: Recipes CI

on:
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "scripts/**"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    paths:
      - "recipes/**"
      - "scripts/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipes-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process_recipes:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate paella image sizes
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_paella_assets.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Normalize recipe IDs
        run: node scripts/convert_name_to_id.mjs

      - name: Validate recipes
        run: node scripts/validate.mjs

      - name: Build index
        run: node scripts/build_index.mjs

      - name: Show generated changes
        run: git status --short

      - name: Commit generated files
        if: >
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add recipes index.json assets

          if git diff --cached --quiet; then
            echo "Everything already up to date"
          else
            git commit -m "chore: normalize recipes and update index"
            git push
          fi
