name: Recipes CI

on:
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "scripts/**"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    paths:
      - "recipes/**"
      - "scripts/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate recipes
        run: node scripts/validate.mjs

  build_index:
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build index
        run: node scripts/build_index.mjs

      - name: Inspect generated index
        run: |
          cat index.json
          git status --short

      - name: Commit generated index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json

          if git diff --cached --quiet; then
            echo "Index already up to date"
          else
            git commit -m "chore: update recipe index"
            git push
          fi